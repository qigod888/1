<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEURAL-LINK ARCHIVE v2.0 | AR.js Fusion</title>
    
    <!-- Базовые скрипты для 3D и AR -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #ff00ea;
            --bg: #050505;
            --glass: rgba(0, 20, 30, 0.85);
            --font-code: 'JetBrains Mono', monospace;
        }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; overflow: hidden; font-family: 'JetBrains Mono', monospace; }
        
        /* Фон и HUD */
        #dataCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.2; pointer-events: none; }
        .hud-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 10;
            border: 1px solid rgba(0, 240, 255, 0.1);
            background: 
                linear-gradient(to right, var(--primary) 1px, transparent 1px) 0 0,
                linear-gradient(to bottom, var(--primary) 1px, transparent 1px) 0 0;
            background-size: 50px 50px; opacity: 0.05;
        }

        /* Терминал */
        #terminal {
            position: fixed; top: 20px; left: 20px; width: 280px;
            background: var(--glass); border: 1px solid var(--primary);
            padding: 15px; border-radius: 4px; z-index: 100;
            font-size: 10px; color: var(--primary); pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        /* Model Viewer */
        model-viewer {
            width: 100%; height: 100vh; position: relative; z-index: 5;
            --poster-color: transparent;
        }

        /* AR.js Сцена (скрыта по умолчанию) */
        #ar-scene-container {
            position: fixed; inset: 0; z-index: -1; display: none;
        }

        /* Кнопки и Хотспоты */
        .Hotspot {
            background: var(--primary); border-radius: 50%; width: 16px; height: 16px;
            border: 2px solid #fff; cursor: pointer; z-index: 6; pointer-events: auto;
            box-shadow: 0 0 15px var(--primary);
        }
        .HotspotAnnotation {
            background: var(--glass); border: 1px solid var(--primary);
            padding: 12px; border-radius: 4px; color: #fff; width: 180px;
            position: absolute; left: 25px; opacity: 0; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px); pointer-events: none; font-size: 11px;
        }
        .Hotspot:hover .HotspotAnnotation { opacity: 1; transform: translateX(5px); }

        /* Футуристичная кнопка */
        #ar-init-btn {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: #000; border: 1px solid var(--primary); color: var(--primary);
            padding: 20px 50px; font-family: 'Unbounded'; font-size: 12px; font-weight: 700;
            cursor: pointer; z-index: 100; pointer-events: auto;
            letter-spacing: 4px; text-transform: uppercase;
            transition: 0.4s; box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        #ar-init-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 50px var(--primary); }

        /* Media Hub */
        .media-hub {
            position: fixed; right: 25px; bottom: 25px; width: 380px;
            background: var(--glass); border: 1px solid var(--primary);
            backdrop-filter: blur(20px); border-radius: 10px; display: none;
            flex-direction: column; z-index: 1001; pointer-events: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .hub-header { padding: 15px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); font-size: 10px; color: var(--primary); display: flex; justify-content: space-between; }
        .hub-tabs { display: flex; background: rgba(0,0,0,0.3); }
        .tab { flex: 1; padding: 12px; background: none; border: none; color: #666; cursor: pointer; font-size: 10px; font-family: inherit; transition: 0.3s; }
        .tab.active { color: var(--primary); background: rgba(0, 240, 255, 0.1); border-bottom: 2px solid var(--primary); }
        
        .close-hub { cursor: pointer; color: #ff4444; }

        /* AR UI элементы (поверх камеры) */
        #ar-ui {
            position: fixed; inset: 0; z-index: 2000; display: none; pointer-events: none;
        }
        #ar-ui .ar-back-btn {
            position: absolute; top: 30px; left: 30px; padding: 10px 20px;
            background: rgba(0,0,0,0.8); border: 1px solid #fff; color: #fff;
            pointer-events: auto; cursor: pointer; font-size: 12px;
        }

        /* Состояние перегрузки */
        body.overdrive { --primary: #ff1100; }
        body.overdrive .Hotspot { box-shadow: 0 0 25px #ff1100; }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .scan-line {
            position: absolute; width: 100%; height: 2px; background: var(--primary);
            top: 0; opacity: 0.3; animation: scanline 4s linear infinite;
        }
    </style>
</head>
<body>
    <canvas id="dataCanvas"></canvas>
    <div class="hud-overlay"></div>
    
    <div id="terminal">
        <div style="font-weight: bold; color: #fff; margin-bottom: 8px; letter-spacing: 1px;">> ARCHIVE_INIT_v2.0</div>
        <div id="logContent">Загрузка протоколов AR.js Fusion...</div>
    </div>

    <!-- 1. Модель для десктопа/превью -->
    <model-viewer 
        id="mainModel"
        src="https://qigod888.github.io/1/demos.glb" 
        ar-modes="webxr scene-viewer quick-look"
        camera-controls 
        interaction-prompt="none"
        shadow-intensity="2"
        exposure="1">
        
        <button class="Hotspot" slot="hotspot-1" data-position="0.39m -0.52m -0.07m" data-normal="0 1 0">
            <div class="HotspotAnnotation">HAND_INTERFACE: 48-bit Logic Connector</div>
        </button>
        <button class="Hotspot" id="eyeTrigger" slot="hotspot-5" data-position="0.03m 0.35m 0.46m" data-normal="0 0 1">
            <div class="HotspotAnnotation">NEURAL_EYE: Optical Quantum Sensor</div>
        </button>
        
        <div class="scan-line"></div>
    </model-viewer>

    <button id="ar-init-btn">ИНИЦИАЛИЗАЦИЯ AR.js СРЕДЫ</button>

    <!-- 2. AR.js / A-Frame Сцена -->
    <div id="ar-scene-container">
        <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;'>
            <a-assets>
                <a-asset-item id="robotModel" src="https://qigod888.github.io/1/demos.glb"></a-asset-item>
            </a-assets>

            <!-- Маркер Hiro (стандарт) или безмаркерное перемещение -->
            <a-marker preset="hiro">
                <a-entity 
                    gltf-model="#robotModel" 
                    scale="0.5 0.5 0.5" 
                    position="0 0 0"
                    rotation="-90 0 0"
                    animation="property: rotation; to: -90 360 0; loop: true; dur: 20000; easing: linear">
                </a-entity>
                
                <!-- Хотспоты в 3D пространстве AR.js -->
                <a-sphere position="0.2 0.3 0.2" radius="0.05" color="#00f0ff" 
                    animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000">
                </a-sphere>
                <a-text value="DATA_NODE_01" position="0.3 0.4 0.2" scale="0.5 0.5 0.5" color="#fff"></a-text>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </div>

    <!-- UI поверх AR -->
    <div id="ar-ui">
        <div class="ar-back-btn" onclick="exitAR()">ВЫХОД ИЗ СЕССИИ</div>
        <div id="terminal-ar" style="position:absolute; bottom:30px; left:30px; font-size:10px; color:var(--primary); background:rgba(0,0,0,0.7); padding:10px;">
            > AR_MODE: ACTIVE<br>
            > TRACKING: STABLE
        </div>
    </div>

    <!-- Media Hub -->
    <div class="media-hub" id="mediaHub">
        <div class="hub-header">
            <span>NEURAL_NODE_ACCESS</span>
            <span class="close-hub" onclick="closeHub()">[TERMINATE]</span>
        </div>
        <div class="hub-tabs">
            <button class="tab active" onclick="setMode('vid')">VISUAL_FEED</button>
            <button class="tab" onclick="setMode('aud')">ENCRYPTED_COMMS</button>
        </div>
        <div style="padding: 20px;">
            <div id="vidContent">
                <iframe id="videoIframe" width="100%" height="200" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="border: 1px solid var(--primary);"></iframe>
            </div>
            <div id="audContent" style="display:none; text-align:center;">
                <div style="margin-bottom:15px; color:#888;">DECRYPTING SIGNAL...</div>
                <audio id="audioPlayer" controls style="width:100%; filter: invert(1);"></audio>
            </div>
        </div>
    </div>

    <script>
        // 1. Матричный фон
        const canvas = document.getElementById('dataCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = "010101🤖SYNC";
        const drops = Array(Math.floor(canvas.width / 12)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary');
            ctx.font = "12px monospace";
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * 12, y * 12);
                if (y * 12 > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);

        // 2. Логгер
        const logContent = document.getElementById('logContent');
        function log(msg) {
            const p = document.createElement('div');
            p.innerHTML = `> ${msg}`;
            logContent.prepend(p);
            if(logContent.children.length > 8) logContent.lastChild.remove();
        }

        // 3. Интеграция AR.js
        const arBtn = document.getElementById('ar-init-btn');
        const mv = document.getElementById('mainModel');
        const arScene = document.getElementById('ar-scene-container');
        const arUI = document.getElementById('ar-ui');

        arBtn.addEventListener('click', () => {
            log("INIT_HYBRID_AR_SESSION...");
            mv.style.display = 'none';
            arBtn.style.display = 'none';
            document.getElementById('terminal').style.display = 'none';
            
            arScene.style.display = 'block';
            arUI.style.display = 'block';
            document.body.style.background = 'transparent';
            
            log("WEBCAM_STREAM: CONNECTED");
            log("AR_MARKER_SCAN: PENDING (Find 'Hiro' marker)");
        });

        function exitAR() {
            location.reload(); // Простой способ сбросить все AR-процессы
        }

        // 4. Взаимодействие с хотспотами
        document.querySelectorAll('.Hotspot').forEach(h => {
            h.addEventListener('click', () => {
                const nodeName = h.getAttribute('slot').toUpperCase();
                log(`ACCESSING_${nodeName}...`);
                document.getElementById('mediaHub').style.display = 'flex';
                document.getElementById('videoIframe').src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
            });
        });

        function closeHub() { 
            document.getElementById('mediaHub').style.display = 'none'; 
            document.getElementById('videoIframe').src = "";
            log("SESSION_STBY");
        }

        function setMode(mode) {
            document.getElementById('vidContent').style.display = mode === 'vid' ? 'block' : 'none';
            document.getElementById('audContent').style.display = mode === 'aud' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            log(`SWITCH_MODE: ${mode.toUpperCase()}`);
        }

        // ПАСХАЛКА: Тройной тап
        let clicks = 0;
        document.getElementById('eyeTrigger').addEventListener('click', () => {
            clicks++;
            if(clicks === 3) {
                document.body.classList.add('overdrive');
                log("!!! CRITICAL_SYSTEM_OVERDRIVE !!!");
                alert("WARNING: Deep Space Photogrammetry Mode Active.");
            }
            setTimeout(() => clicks = 0, 1000);
        });

        log("SYSTEM_READY. AWAITING_INPUT.");
    </script>
</body>
</html>
