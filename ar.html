<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Neural Link AR</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f0ff;
      --bg: rgba(0, 20, 30, 0.86);
      --font-code: 'JetBrains Mono', monospace;
      --font-ui: 'Unbounded', sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: var(--font-code);
      background: transparent;
      color: #fff;
    }
    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      background: #000;
    }
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
      pointer-events: none !important;
    }
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    #status {
      position: absolute;
      top: 16px;
      right: 16px;
      max-width: calc(100vw - 32px);
      background: var(--bg);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 11px;
    }
    #helpBox {
      position: absolute;
      top: 16px;
      left: 16px;
      max-width: min(320px, calc(100vw - 32px));
      background: var(--bg);
      border: 1px solid rgba(0,240,255,.35);
      color: #d7f7fb;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.45;
    }
    #hotspots-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hotspot-wrap {
      position: absolute;
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: auto;
    }
    .hotspot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: var(--primary);
      box-shadow: 0 0 14px var(--primary);
      cursor: pointer;
      pointer-events: auto;
    }
    .annotation {
      margin-top: 8px;
      min-width: 170px;
      max-width: 220px;
      background: var(--bg);
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 10px;
      font-size: 11px;
      display: none;
      line-height: 1.45;
      color: #fff;
    }
    .hotspot-wrap:hover .annotation,
    .hotspot-wrap:focus-within .annotation {
      display: block;
    }
    #mediaHub {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(420px, calc(100vw - 24px));
      background: rgba(0,20,30,.92);
      border: 1px solid var(--primary);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      pointer-events: auto;
    }
    .hub-tabs {
      display: flex;
      border-bottom: 1px solid rgba(0,240,255,.35);
    }
    .tab {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #7aaeb2;
      cursor: pointer;
      font-size: 11px;
      font-family: var(--font-code);
    }
    .tab.active {
      color: var(--primary);
      background: rgba(0,240,255,.08);
    }
    .hub-body { padding: 16px; }
    #hubTitle {
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 10px;
    }
    #hubDescription {
      color: #d7f7fb;
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    #videoArea iframe {
      width: 100%;
      height: 210px;
      border: 0;
      border-radius: 10px;
      background: #000;
    }
    #audContent {
      display: none;
      padding-top: 10px;
    }
    #audioPlayer {
      width: 100%;
    }
    .sys-btn {
      width: 100%;
      margin-top: 12px;
      min-height: 46px;
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 10px;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 12px;
    }
    #backLink {
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      z-index: 4;
      background: var(--bg);
      border: 1px solid rgba(0,240,255,.35);
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 11px;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <a id="backLink" href="javascript:history.back()">НАЗАД</a>

  <div id="overlay">
    <div id="status">ЗАПУСК КАМЕРЫ...</div>
    <div id="helpBox">Если камера не появилась: откройте страницу напрямую по HTTPS, разрешите доступ к камере и попробуйте в Chrome на Android или Safari на iPhone.</div>

    <div id="hotspots-layer">
      <div class="hotspot-wrap" id="hp-1">
        <button class="hotspot" type="button" aria-label="DATA_PORT HAND"></button>
        <div class="annotation">DATA_PORT: HAND</div>
      </div>
      <div class="hotspot-wrap" id="hp-5">
        <button class="hotspot" type="button" aria-label="NEURAL EYE"></button>
        <div class="annotation">NEURAL_EYE (v.3.0)</div>
      </div>
    </div>

    <div id="mediaHub">
      <div class="hub-tabs">
        <button class="tab active" onclick="setMode('vid', event)">VIDEO_FEED</button>
        <button class="tab" onclick="setMode('aud', event)">AUDIO_GUIDE</button>
      </div>
      <div class="hub-body">
        <div id="hubTitle">DATA_NODE_ACTIVE</div>
        <div id="hubDescription"></div>
        <div id="videoArea"><iframe id="videoIframe" src="" allowfullscreen></iframe></div>
        <div id="audContent"><audio id="audioPlayer" controls></audio></div>
        <button class="sys-btn" onclick="closeHub()">CLOSE_SESSION</button>
      </div>
    </div>
  </div>

  <a-scene
    embedded
    renderer="antialias: true; alpha: true"
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    hotspot-tracker>

    <a-marker preset="hiro" id="ar-marker">
      <a-entity gltf-model="url(https://qigod888.github.io/1/demos.glb)" scale="1 1 1" position="0 0 0">
        <a-entity id="anchor-1" position="0.39 -0.52 -0.07"></a-entity>
        <a-entity id="anchor-5" position="0.03 0.35 0.46"></a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const hotspotData = {
      1: {
        title: 'DATA_PORT: HAND',
        description: 'Точка доступа к тактильному модулю. Открывает видеообзор и аудиогид.',
        vid: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
        aud: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
      },
      5: {
        title: 'NEURAL_EYE (v.3.0)',
        description: 'Центральный узел наблюдения. Видео, описание и отдельный аудиогид.',
        vid: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
        aud: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'
      }
    };

    function openHub(id) {
      const item = hotspotData[id];
      document.getElementById('hubTitle').textContent = item.title;
      document.getElementById('hubDescription').textContent = item.description;
      document.getElementById('videoIframe').src = item.vid;
      document.getElementById('audioPlayer').src = item.aud;
      document.getElementById('mediaHub').style.display = 'flex';
      setMode('vid', { target: document.querySelector('.tab') });
    }

    function closeHub() {
      document.getElementById('mediaHub').style.display = 'none';
      document.getElementById('videoIframe').src = '';
      const audio = document.getElementById('audioPlayer');
      audio.pause();
      audio.src = '';
    }

    function setMode(mode, event) {
      document.getElementById('videoArea').style.display = mode === 'vid' ? 'block' : 'none';
      document.getElementById('audContent').style.display = mode === 'aud' ? 'block' : 'none';
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
    }

    document.querySelector('#hp-1 .hotspot').addEventListener('click', () => openHub(1));
    document.querySelector('#hp-5 .hotspot').addEventListener('click', () => openHub(5));

    AFRAME.registerComponent('hotspot-tracker', {
      init: function () {
        this.marker = document.getElementById('ar-marker');
        this.statusEl = document.getElementById('status');
        this.cameraEl = document.querySelector('[camera]');
        this.points = [
          { anchor: document.getElementById('anchor-1'), ui: document.getElementById('hp-1') },
          { anchor: document.getElementById('anchor-5'), ui: document.getElementById('hp-5') }
        ];

        this.statusEl.textContent = 'ПОИСК МАРКЕРА HIRO...';

        this.marker.addEventListener('markerFound', () => {
          this.statusEl.textContent = 'МАРКЕР НАЙДЕН';
          this.statusEl.style.color = '#00ff88';
        });

        this.marker.addEventListener('markerLost', () => {
          this.statusEl.textContent = 'ПОИСК МАРКЕРА HIRO...';
          this.statusEl.style.color = '#00f0ff';
        });

        setTimeout(() => {
          const videos = document.querySelectorAll('video');
          if (!videos.length) {
            this.statusEl.textContent = 'КАМЕРА НЕ ЗАПУЩЕНА: проверьте HTTPS и разрешение камеры';
            this.statusEl.style.color = '#ff7676';
          }
        }, 3500);
      },

      tick: function () {
        const camera = this.cameraEl && this.cameraEl.getObject3D('camera');
        if (!camera || !this.marker || !this.marker.object3D.visible) {
          this.points.forEach(p => p.ui.style.display = 'none');
          return;
        }

        this.points.forEach(p => {
          const v = new THREE.Vector3();
          p.anchor.object3D.getWorldPosition(v);
          v.project(camera);

          const x = (v.x * 0.5 + 0.5) * window.innerWidth;
          const y = (-v.y * 0.5 + 0.5) * window.innerHeight;

          if (v.z < 1) {
            p.ui.style.display = 'block';
            p.ui.style.left = `${x}px`;
            p.ui.style.top = `${y}px`;
          } else {
            p.ui.style.display = 'none';
          }
        });
      }
    });
  </script>
</body>
</html>
